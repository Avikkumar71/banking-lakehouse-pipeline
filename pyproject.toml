[project]
name = "de-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Avikkumar71", email = "ak5589@srmist.edu.in" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
de-pipeline = "de_pipeline:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
